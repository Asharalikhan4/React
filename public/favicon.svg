<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="reactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#reactBg)" />
  
  <!-- React Atom Symbol -->
  <g transform="translate(256, 256)">
    <!-- Center nucleus -->
    <circle cx="0" cy="0" r="34" fill="#ffffff" />
    
    <!-- Orbiting electron paths -->
    <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round">
      <ellipse rx="176" ry="67" />
      <ellipse rx="176" ry="67" transform="rotate(60)" />
      <ellipse rx="176" ry="67" transform="rotate(120)" />
    </g>
  </g>
</svg>
